# Render Blueprint: deploy with "New +" -> "Blueprint" and this repo.
# After the first deploy, set GROQ_API_KEY on the backend service.
services:
  # FastAPI backend
  - type: web
    name: codetutorai-api
    runtime: python
    plan: free               # data lives in MongoDB Atlas (MONGODB_URL), so deploys/restarts don't lose it
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-1}
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: GROQ_API_KEY
        sync: false          # set in dashboard, never committed
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_MAX_TOKENS
        value: "2500"
      - key: PREVIOUS_CHAPTERS_MAX_CHARS
        value: "4000"
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URL
        sync: false          # MongoDB Atlas connection string; data survives deploys
      - key: LOG_DIR
        value: ./logs
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GENERATION_WORKERS
        value: "1"           # one job at a time: concurrent jobs starve each other on Groq's free-tier TPM
      - key: GROQ_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      - key: FRONTEND_ORIGIN
        sync: false          # https://<codetutorai-web>.onrender.com
      - key: PDF_SERVICE_URL
        sync: false          # https://<codetutorai-pdf>.onrender.com/generate-pdf (or leave blank for built-in ReportLab PDFs)
      - key: GITHUB_TOKEN
        sync: false

  # Next.js frontend
  - type: web
    name: codetutorai-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        sync: false          # https://<codetutorai-api>.onrender.com

  # Node PDF service (optional but gives the nicer PDFs)
  - type: web
    name: codetutorai-pdf
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci
    startCommand: node pdf-server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
